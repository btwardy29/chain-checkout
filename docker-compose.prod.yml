services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-chain_checkout}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chain} -d ${POSTGRES_DB:-chain_checkout}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-chain}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chain_checkout}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      RPC_URL: ${RPC_URL}
      CHAIN_ID: ${CHAIN_ID}
      PAYMENT_CONTRACT_ADDRESS: ${PAYMENT_CONTRACT_ADDRESS}
      ACCEPTED_TOKEN_ADDRESS: ${ACCEPTED_TOKEN_ADDRESS}
      REQUIRED_CONFIRMATIONS: ${REQUIRED_CONFIRMATIONS}
      ORDER_EXPIRATION_MINUTES: ${ORDER_EXPIRATION_MINUTES}
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-chain}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chain_checkout}?schema=public
      REDIS_URL: redis://redis:6379
      RPC_URL: ${RPC_URL}
      CHAIN_ID: ${CHAIN_ID}
      PAYMENT_CONTRACT_ADDRESS: ${PAYMENT_CONTRACT_ADDRESS}
      ACCEPTED_TOKEN_ADDRESS: ${ACCEPTED_TOKEN_ADDRESS}
      REQUIRED_CONFIRMATIONS: ${REQUIRED_CONFIRMATIONS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID}
        NEXT_PUBLIC_PAYMENT_CONTRACT_ADDRESS: ${NEXT_PUBLIC_PAYMENT_CONTRACT_ADDRESS}
        NEXT_PUBLIC_TOKEN_ADDRESS: ${NEXT_PUBLIC_TOKEN_ADDRESS}
        NEXT_PUBLIC_BLOCK_EXPLORER_URL: ${NEXT_PUBLIC_BLOCK_EXPLORER_URL}
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID}
      NEXT_PUBLIC_PAYMENT_CONTRACT_ADDRESS: ${NEXT_PUBLIC_PAYMENT_CONTRACT_ADDRESS}
      NEXT_PUBLIC_TOKEN_ADDRESS: ${NEXT_PUBLIC_TOKEN_ADDRESS}
      NEXT_PUBLIC_BLOCK_EXPLORER_URL: ${NEXT_PUBLIC_BLOCK_EXPLORER_URL}
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres-data:
  redis-data:
